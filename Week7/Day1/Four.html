<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Choose a Theme</title>
    <link rel="stylesheet" href="them.css">
    <script src="them.js" defer></script>
</head>
<body>
    <h1>Choose a Theme</h1>
    <fieldset>
        <legend>Select a color theme</legend>
        <label><input type="radio" name="rdoTheme" value="silver"> Silver</label>
        <label><input type="radio" name="rdoTheme" value="orange"> Orange</label>
        <label><input type="radio" name="rdoTheme" value="blue"> Blue</label>
    </fieldset>
    <button id="btnApply" type="button">Apply Theme</button>
</body>
</html>
