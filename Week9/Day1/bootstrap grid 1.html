<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <h2>1. ជួរឈរប្រវែងស្មើរគ្នា</h2>
    <div class="container">
        <div class="row">
            <div class="col"> ជួរឈរទី១​</div>
            <div class="col"> ជួរឈរទី២​</div>
        </div>
    </div>

    <h2>2. ជួរឈរបទី១មាន ២ក្រឡា ជូរឈរទី២ ស្វ័យប្រវត្ត</h2>
    <div class="container">
        <div class="row">
            <div class="col-2"> ជូរឈរទី១</div>
            <div class="col"> ជួរឈរទី២</div>
        </div>
    </div>

    <h2>3. ជួរឈរបទី១មាន ៣ក្រឡា ជូរឈរទី២ ៩ក្រឡា</h2>
    <div class="container">
        <div class="row">
            <div class="col-3"> ជូរឈរទី១</div>
            <div class="col-9"> ជួរឈរទី២</div>
        </div>
    </div>

    <h2>4 ទូរសព្ទ​ ថេប្លេត កុំព្យូទ័រ</h2>
    <h3> ទម្រង់ពេញ</h3>
    <div class="container">
        <div class="row">
            <div class="col-12 col-md-6 col-lg-4"> ជួរឈរទី១</div>
            <div class="col-12 col-md-6 col-lg-4"> ជួរឈរទី២</div>
            <div class="col-12 col-md-6 col-lg-4"> ជួរឈរទី៣</div>
        </div>
    </div>

    <h3> ទម្រង់តកាត់</h3>
    <div class="container">
        <div class="row row-col-md-2 row col-lg-3">
            <div>ជួរឈរទី១</div>
            <div>ជួរឈរទី២</div>
            <div>ជួរឈរទី៣</div>
        </div>
    </div>
</body>
</html>
