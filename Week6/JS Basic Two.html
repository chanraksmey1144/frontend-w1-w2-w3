<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Animation — playground</title>
  <style>
    * {margin:0; padding:0; box-sizing:border-box; }
    html, body {font:16px/1.6 Roboto, "Helvetica Neue", Helvetica, Arial, sans-serif; }
    h1{text-align: center; font-variant: small-caps;}
    #dx1{padding-top:4rem; width:15rem; height:15rem; border-radius: 50%; margin:1rem auto; text-align:center; font-size:4rem ;  }
    
  </style>
</head>
<body>
  <h1>dynamic text and dynamic style </h1>
  <div class="circle" > 
    <div id="dx1" style="background:greenyellow;">បៃតង</div> 
  </div>
  <script>
    /* បង្កើត colors array ផ្ទុកពណ៌សម្រាប់យកទៅដូរពណ៌ផ្ទៃនិងពណ៌អក្សរ */
     
    /* បង្កើត contents array ផ្ទុកអក្សរសម្រាប់យកទៅដូរអក្សរ */
    
    /* បង្កើតអថេរ i */
     
    /* 
      setInterval (កិច្ច , រយៈពេលគិតជាមីលីវិនាទី);  
      ធ្វើកិច្ចសារចុះសារឡើងម្តងហើយម្តងទៀត ពេលដល់រយៈពេលបានកំណត់ ដូចជា ១០០០ គឺ ១០០០មីលីវិនាទី ធ្វើកិច្ចម្តង។ 
      */
    setInterval(()=>{
      /* ក្នុងវេបផេកជ្រើសធាតុមានអាយឌី dx1 ហើយតាងដោយអថេរ dx1 */
       
      /* ដូរអក្សរឱ្យធាតុមានអាយឌី dx1 - dynamic text */
       
      /* ដូរពណ៌ផ្ទៃឱ្យធាតុមានអាយឌី dx1 - dynamic css   */
      
      /* ដូរពណ៎អក្សរឱ្យធាតុមានអាយឌី dx1 - dynamic css */
      
      /* ត្រលប់តម្លៃ i មក ០ វិញពេល i មានតម្លៃ 2 */
      
    },1000);
  </script>
</body>
</html>
